<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080e">
  <meta name="description" content="A rotating 3D particle Christmas tree drawn entirely with coloured ASCII characters.">
  <title>ASCII Christmas Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306080e'/%3E%3Cpath d='M16 4 26 26H6Z' fill='%232ebe54'/%3E%3Ccircle cx='16' cy='5' r='2.5' fill='%23ffc440'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="tree" role="img" aria-label="Animated ASCII art of a rotating Christmas tree with lights, baubles, presents and a star. Tap or press Space to pause."></canvas>
    <div class="controls">
      <button id="btn-restart" type="button" title="Restart (R)" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
      </button>
      <button id="btn-shot" type="button" title="Screenshot (S)" aria-label="Download screenshot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>
      </button>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
